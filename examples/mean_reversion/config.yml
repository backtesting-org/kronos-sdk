# Strategy Metadata (required for Kronos CLI discovery)
name: mean_reversion
display_name: "Mean Reversion Strategy"
description: "Bollinger Bands mean reversion with RSI confirmation"
type: mean_reversion
icon: "📉"

# Strategy Configuration
exchanges:
  - binance
  - bybit

assets:
  binance:
    - BTC/USDT
    - ETH/USDT
  bybit:
    - BTC/USDT

parameters:
  timeframe: 1h
  bollinger_period: 20
  bollinger_std_dev: 2.0
  rsi_period: 14
  rsi_oversold: 35
  rsi_overbought: 65

risk:
  max_position_size: 1000
  stop_loss_percent: 2.0
  take_profit_percent: 5.0

execution:
  order_type: limit
  slippage_tolerance: 0.1
